services:
  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: annapurna-backend
    ports:
      - "8000:8000"
    volumes:
      - annapurna-data:/app/data  # Persistent local storage for SQLite
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///app/data/annapurna.db
      - LLM_BASE_URL=http://host.docker.internal:11434  # Reach Ollama on host
      - LLM_MODEL=llama3.2:latest
      - LLM_PROVIDER=ollama
      - ENABLE_USDA=false
      - ENABLE_PUBMED=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - annapurna-net

volumes:
  annapurna-data:
    driver: local

networks:
  annapurna-net:
    driver: bridge
