services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: annapurna-backend
    environment:
      APP_ENV: development
      DEBUG: "false"
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      DATABASE_URL: "sqlite+aiosqlite:////app/data/annapurna.db"
      LLM_PROVIDER: ollama
      LLM_BASE_URL: "http://host.docker.internal:11434"
      LLM_MODEL: "llama3.2:latest"
      LLM_API_KEY: ""
      ENABLE_EXTERNAL_NETWORK: "false"
      ENABLE_USDA: "false"
      USDA_API_KEY: ""
      ENABLE_PUBMED: "false"
      PUBMED_EMAIL: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - annapurna-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - annapurna-net

  ollama:
    image: ollama/ollama:latest
    profiles:
      - ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - annapurna-net

volumes:
  annapurna-data:
  ollama-data:

networks:
  annapurna-net:
    driver: bridge
